name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 检查（lint/类型/文案/测试）与构建（fixture + astro build）互不依赖，并行跑；
# 分支保护的 required check 锁的是「检查与构建」这个名字，由末尾的聚合 job 承担。
jobs:
  check:
    name: 检查（格式、Lint、类型、文案、测试）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # setup-vp 会安装 Vite+、Node.js 与包管理器，并默认执行 vp install
      - name: 安装 Vite+ 与依赖
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: 格式、Lint、类型与文案检查
        run: vp check && vp run i18n:check

      - name: 单元测试
        run: vp test

  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Vite+ 与依赖
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      # 站点是数据驱动的，构建前先造一份固定数据集：
      # CI 里不跑抓取（没网、也不该在 CI 骚扰源站），构建结果与源站改版解耦
      - name: 准备构建用数据集
        run: vpr db:fixture

      - name: 构建
        run: vpr build
        env:
          BOGUAN_DB: data/fixture.db

  ops:
    name: 运维脚本回归
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 安装运维校验工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 shellcheck
      - name: Shell 检查与故障场景测试
        run: |
          shellcheck -x -P deploy/ops deploy/ops/*.sh
          python3 deploy/ops/test_ops.py
          if [ ! -x /usr/local/bin/node ]; then
            sudo ln -s "$(command -v node)" /usr/local/bin/node
          fi
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

  gate:
    # always 保证上游失败或取消时，这个 required check 也明确失败。
    if: always()
    name: 检查与构建
    needs: [check, build, ops]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 所有检查均已通过
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          OPS_RESULT: ${{ needs.ops.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$OPS_RESULT" = success
