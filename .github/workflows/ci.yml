name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # setup-vp 会安装 Vite+、Node.js 与包管理器，并默认执行 vp install
      - name: 安装 Vite+ 与依赖
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: 格式、Lint 与类型检查
        run: vp check

      - name: 国际化文案检查
        run: vp run i18n:check

      - name: 构建
        run: vpr build
