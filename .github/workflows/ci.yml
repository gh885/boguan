name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # Astro 构建时由 Node 执行，需要满足 package.json 的 engines 要求
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 格式、Lint 与类型检查
        run: bunx vp check

      - name: 构建
        run: bun run build
